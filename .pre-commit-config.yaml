# Optional local checks, run on `git commit`.
#
# Install with:
#     pip install pre-commit
#     pre-commit install
#
# CI runs the same lint and type checks, so this is a convenience rather than a
# gate. The secret scan is the exception: it is worth catching before a tape full
# of prompts leaves your machine.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.(jsonl|md)$
      - id: end-of-file-fixer
        exclude: \.jsonl$
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        # Tapes and blob stores can be large; they should never be committed.
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-committed-tapes
        name: refuse to commit recorded tapes
        # A tape records full prompts, model responses, and the contents of any
        # file the agent read. It is working data, not source.
        entry: bash -c 'if git diff --cached --name-only | grep -E "(\.tape/|^runs/|^\.agenttape/)"; then echo "Refusing to commit recorded tapes. Remove them from the index."; exit 1; fi'
        language: system
        pass_filenames: false
