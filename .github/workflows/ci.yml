name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Keep the matrix honest without paying for every combination.
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest tests -q

      - name: Test with a randomised hash seed
        # The canonical encoder must not depend on PYTHONHASHSEED. Running the
        # suite under a random seed is the cheapest way to keep that honest.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        env:
          PYTHONHASHSEED: random
        run: python -m pytest tests -q

  examples:
    name: examples run offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - name: Run every example
        run: |
          for script in examples/0*.py; do
            echo "::group::$script"
            python "$script"
            echo "::endgroup::"
          done

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy src/agenttape

  coverage:
    name: coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"

      - name: Measure
        # `fail_under` lives in pyproject.toml so the threshold is documented in
        # one place rather than buried in the workflow.
        run: python -m pytest tests -q --cov=agenttape --cov-report=term-missing

  package:
    name: build the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine

      - name: Build
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/installed
          /tmp/installed/bin/python -m pip install --upgrade pip
          /tmp/installed/bin/python -m pip install dist/*.whl pytest
          /tmp/installed/bin/python -c "import agenttape; print('imported', agenttape.__version__)"

      - name: Run the suite against the installed wheel
        # Guards against a wheel that imports fine but is missing a module, or
        # that ships tests/examples it should not. The suite is copied out of the
        # checkout so that `src/` is not importable and the installed package is
        # the only thing under test.
        run: |
          mkdir -p /tmp/wheel-test
          cp -r tests /tmp/wheel-test/tests
          cd /tmp/wheel-test
          /tmp/installed/bin/python -m pytest tests -q -p no:cacheprovider

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
