[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agenttape"
dynamic = ["version"]
description = "Record AI agent runs to local files and replay them offline, deterministically."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "jomin2003" }]
keywords = [
    "ai-agents",
    "llm",
    "deterministic-replay",
    "record-and-replay",
    "reproducibility",
    "debugging",
    "time-travel-debugging",
    "observability",
    "testing",
    "rollback",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
# Zero runtime dependencies. This is a deliberate constraint, not an oversight:
# a replay engine sits underneath the agent, so every dependency it adds is a
# dependency the agent inherits, and a dependency that could itself introduce
# non-determinism.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/jomin2003/Agent-Tape"
Documentation = "https://github.com/jomin2003/Agent-Tape/tree/main/docs"
Repository = "https://github.com/jomin2003/Agent-Tape"
Issues = "https://github.com/jomin2003/Agent-Tape/issues"
Changelog = "https://github.com/jomin2003/Agent-Tape/blob/main/CHANGELOG.md"

# No [project.scripts]: agenttape is a library, not a CLI or an application.
# It is meant to be imported by the agent runtime, not invoked from a shell.

[tool.hatch.version]
path = "src/agenttape/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agenttape"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/research",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/SECURITY.md",
    "/CITATION.cff",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:agenttape.*"]

[tool.coverage.run]
branch = true
source = ["agenttape"]

[tool.coverage.report]
# A floor, not a target. It is here to catch a new module or a new branch
# arriving with no tests at all, not to demand that every defensive guard be
# exercised. The guards that genuinely cannot be reached are marked
# `# pragma: no cover` with a comment saying why.
fail_under = 95
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "examples"]
extend-exclude = [".workbuddy-ai"]

[tool.ruff.lint]
# A deliberately narrow set: correctness and import hygiene, not style churn.
#
# Notably absent is `UP` (pyupgrade). The codebase uses str.format() uniformly
# rather than f-strings; both are idiomatic, and rewriting ~200 call sites would
# be a large mechanical diff for no functional gain. Similarly `N` (naming) and
# `PTH`/`ARG`/`RET`/`TCH` were dropped: their findings here were stylistic
# preferences rather than defects, and a lint config that argues with the
# codebase is a lint config people learn to ignore.
select = ["E", "F", "W", "I", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",    # line length is the formatter's job
    "B008",    # function calls in argument defaults are fine here
    "RUF001",  # non-ASCII punctuation in prose (x, em dashes, arrows)
    "RUF002",
    "RUF003",
    "RUF022",  # __all__ is grouped by API area to mirror the documentation
    "SIM108",  # a ternary is not always clearer than if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "B011",    # assert False is fine in a test
    # `with pytest.raises(...)` around `with session:` reads better nested than
    # combined on one line, which is why the tests are written that way.
    "SIM117",
]

[tool.mypy]
# Deliberately no `python_version` override. The package supports Python 3.9,
# but mypy dropped the ability to target it, so pinning this to 3.10 would make
# the config contradict `requires-python`. Compatibility with 3.9 is guarded by
# the 3.9 pytest job in CI -- which is the check that actually caught a
# 3.9-and-3.10-only runtime bug that type checking could never have seen.
files = ["src/agenttape"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
