[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agenttape"
dynamic = ["version"]
description = "Record AI agent runs to local files and replay them offline, deterministically."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "jomin2003" }]
keywords = [
    "ai-agents",
    "llm",
    "deterministic-replay",
    "record-and-replay",
    "reproducibility",
    "debugging",
    "time-travel-debugging",
    "observability",
    "testing",
    "rollback",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
# Zero runtime dependencies. This is a deliberate constraint, not an oversight:
# a replay engine sits underneath the agent, so every dependency it adds is a
# dependency the agent inherits, and a dependency that could itself introduce
# non-determinism.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/jomin2003/Agent-Tape"
Documentation = "https://github.com/jomin2003/Agent-Tape/tree/main/docs"
Repository = "https://github.com/jomin2003/Agent-Tape"
Issues = "https://github.com/jomin2003/Agent-Tape/issues"
Changelog = "https://github.com/jomin2003/Agent-Tape/blob/main/CHANGELOG.md"

# No [project.scripts]: agenttape is a library, not a CLI or an application.
# It is meant to be imported by the agent runtime, not invoked from a shell.

[tool.hatch.version]
path = "src/agenttape/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agenttape"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/research",
    "/README.md",
    "/LICENSE",
    "/NOTICE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/SECURITY.md",
    "/CITATION.cff",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:agenttape.*"]

[tool.coverage.run]
branch = true
source = ["agenttape"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function calls in argument defaults are fine here
    "RUF001", # allow non-ASCII punctuation in prose
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]
"examples/*" = ["T201", "ARG"]

[tool.mypy]
python_version = "3.9"
files = ["src/agenttape"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
